[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompttestenv"
version = "0.1.0"
description = "PromptTestEnv — Models and Prompts benchmarking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "streamlit",
    "jinja2",
    "unified-ai-client",
]

[project.scripts]
prompttestenv = "prompttestenv.__main__:main"

[tool.setuptools.packages.find]
include = ["prompttestenv*"]

[tool.setuptools.package-data]
prompttestenv = ["templates/*"]

